<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MMI Jallosh 2026 Check-In</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://unpkg.com/html5-qrcode"></script>

</head>

<body>

<div class="background"></div>

<div class="container">

    <header class="header">

        <div>
            <h1>MMI Jallosh 2026</h1>
            <p>Volunteer Check-In Scanner</p>
        </div>

        <div class="status">
            <span class="dot"></span>
            <span id="scannerStatus">Ready</span>
        </div>

    </header>

    <div class="scanner-card">

        <!-- Camera (Hidden Initially) -->
        <div id="reader" style="display:none;"></div>

        <!-- Camera Placeholder -->
        <div id="cameraPlaceholder" class="camera-placeholder">

            <div class="camera-icon">📷</div>

            <h2>Camera is Off</h2>

            <p>Click the button below to scan a ticket.</p>

        </div>

        <!-- Scan Button -->
        <button id="scanBtn" class="scan-btn">

            📷 Scan Ticket

        </button>

    </div>

    <div id="resultCard" class="result-card waiting">

        <div class="result-header">

            <span id="statusIcon">📷</span>

            <div>

                <h2 id="statusTitle">Ready to Scan</h2>

                <small>Last Scan Result</small>

            </div>

        </div>

        <div class="result-body">

            <h3 id="guestName">Waiting for first ticket...</h3>

            <div id="scanDetails">

                Click <strong>Scan Ticket</strong> to begin.

            </div>

        </div>

    </div>

</div>

<script src="config.js"></script>
<script src="api.js"></script>
<script src="app.js"></script>

</body>

</html>
