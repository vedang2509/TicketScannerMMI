<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MMI Dashboard</title>

    <link rel="stylesheet" href="dashboard.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<header>

    <h1>🎫 Jallosh 2026 Dashboard</h1>

    <div id="status">
        🟢 Live
    </div>
    
<div>
    <span id="status">🟢 Live</span>
</div>

<div class="last-refresh">
    Last Updated:
    <span id="lastUpdated">--:--:--</span>
</div>
</header>

<main>

    <section class="cards">

        <div class="card">

            <h3>Bookings</h3>

            <h2 id="bookings">0</h2>

        </div>

        <div class="card">

            <h3>Total Tickets</h3>

            <h2 id="tickets">0</h2>

        </div>

        <div class="card">

            <h3>Checked In</h3>

            <h2 id="checkedIn">0</h2>

        </div>

        <div class="card">

            <h3>Remaining</h3>

            <h2 id="remaining">0</h2>

        </div>

    </section>

<section class="attendance">

    <div class="attendance-header">

        <span>Attendance</span>

        <span id="attendancePercent">0%</span>

    </div>

    <div class="progress">

        <div
            id="attendanceBar"
            class="progress-fill">
        </div>

    </div>

</section>

    <section class="charts">

        <div class="chart-card">

            <h3>Attendance Progress</h3>

            <canvas id="progressChart"></canvas>

        </div>

        <div class="chart-card">

            <h3>Check-ins Over Time</h3>

            <canvas id="timelineChart"></canvas>

        </div>

    </section>

    <section class="search">

        <input
                id="searchBox"
                type="text"
                placeholder="Search Reference or Name">

        <div id="searchResults"></div>

    </section>

    <section class="recent">

        <h2>Recent Check-ins</h2>

        <table>

            <thead>

            <tr>

                <th>Time</th>

                <th>Reference</th>

                <th>Name</th>

                <th>Result</th>

            </tr>

            </thead>

            <tbody id="recentTable"></tbody>

        </table>

    </section>

</main>

<script src="config.js"></script>
<script src="api.js"></script>
<script src="dashboard.js"></script>

</body>

</html>
